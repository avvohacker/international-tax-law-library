# The register of every bilateral treaty this library holds.
#
# Mirrors the corpus contract (international-tax-law-corpus,
# provenance/sources.yaml): the hash, not the file, is the contract.
# The PDFs themselves are NOT redistributed. They are fetched, hashed and
# read locally under sources/ (gitignored); what is committed here is the
# hash, the page-anchored extraction, and the declared gaps.
#
# A treaty enters only with all of these:
#   id:        stable slug, "<party-a>-<party-b>-<signature-year>",
#              alphabetical party order.
#   parties:   the two contracting states, canonical English names.
#   title:     the treaty's official title, as published.
#   source:    url (official publisher), sha256 of the exact bytes read,
#              retrieved date (YYYY-MM-DD), language(s) as published.
#   rights:    status (public_domain | open_licence |
#              licence_with_conditions | unknown), redistribute (never true
#              for source PDFs), note with verification date.
#   produces:  what is built from this source, and where (artefact path
#              under treaties/<id>/). A source whose artefact does not exist
#              yet says so with a reason instead of being absent.
#   status:    published | in-preparation | unread (with reason — e.g. scanned
#              images with no extractable text and no OCR in this pipeline).
#   gaps:      what was declared rather than filled (unread pages, unmeasured
#              tables), with the reason each artefact gives.
#
# Nothing enters without a hash, pages, and gaps.
treaties:
  - id: uk-us-2001
    parties:
      - United Kingdom of Great Britain and Northern Ireland
      - United States of America
    title: >-
      Convention between the Government of the United States of America and
      the Government of the United Kingdom of Great Britain and Northern
      Ireland for the Avoidance of Double Taxation and the Prevention of
      Fiscal Evasion with respect to Taxes on Income, signed 24 July 2001,
      with protocol signed 19 July 2002
    source:
      url: https://home.treasury.gov/system/files/131/Treaty-UK-7-24-2001.pdf
      publisher: United States Department of the Treasury / Internal Revenue Service
      sha256: 08788d92f1ad8e900850d14e8dcbdd8597f00b205fbba6a65d3fba999c82300a
      retrieved: 2026-10-10
      verified: 2026-10-10
      languages:
        - English
      pages: 39
    rights:
      status: public_domain
      redistribute: false
      note: >-
        Official text of a treaty to which the United States is a party,
        published by the U.S. Treasury/IRS; as a work of the U.S. Government
        not subject to domestic copyright (17 U.S.C. 105). The PDF is still
        fetched, hashed and read locally rather than committed. Verified
        against the direct link published on the IRS "United Kingdom (UK)
        tax treaty documents" page on 2026-10-10.
    produces:
      - artefact: treaties/uk-us-2001/treaty.json
        how: >-
          scripts/build.py reads the fetched PDF as one unit per page, each
          anchored to its page number, and writes treaty.json;
          tests/test_treaty.py rebuilds it and compares byte for byte.
      - artefact: treaties/uk-us-2001/treaty.md
        how: >-
          rendered from treaty.json by scripts/build.py, never edited by hand.
    status: published
    gaps: []
  - id: no-uk-2013
    parties:
      - Norway
      - United Kingdom of Great Britain and Northern Ireland
    title: >-
      Convention between the United Kingdom of Great Britain and Northern
      Ireland and the Kingdom of Norway for the Avoidance of Double Taxation
      and the Prevention of Fiscal Evasion with respect to Taxes on Income and
      on Capital Gains, signed 14 March 2013
    source:
      url: https://assets.publishing.service.gov.uk/media/5a75bb72e5274a43682998b9/norway-dtc-inforce_-_in_force.pdf
      publisher: HM Revenue & Customs / GOV.UK
      sha256: ccc70ace3f94a8ceb3a3ac733857cea7a558d3b50ee71992a908b429dcfe7bd7
      retrieved: 2026-10-11
      verified: 2026-10-11
      languages:
        - English
      pages: 28
    rights:
      status: open_licence
      redistribute: false
      note: >-
        Published on GOV.UK, whose pages carry the Open Government Licence
        v3.0 and (c) Crown copyright in the site footer; the PDF itself states
        no separate licence, so the licence is recorded as the publisher's own
        stated terms rather than the file's. The PDF is still fetched, hashed
        and read locally rather than committed. Verified against the direct
        link published on the GOV.UK "Norway: tax treaties" page on
        2026-10-11, where the publisher lists it as "2013 UK-Norway Double
        Taxation Convention - in force".
    produces:
      - artefact: treaties/no-uk-2013/treaty.json
        how: >-
          scripts/build.py reads the fetched PDF as one unit per page, each
          anchored to its page number, and writes treaty.json;
          tests/test_treaty.py rebuilds it and compares byte for byte. The
          document is the publisher's "in force" text: page 1 is the note of
          entry into force and effect dates, and the convention's own text
          follows.
      - artefact: treaties/no-uk-2013/treaty.md
        how: >-
          rendered from treaty.json by scripts/build.py, never edited by hand.
    status: published
    gaps: []
